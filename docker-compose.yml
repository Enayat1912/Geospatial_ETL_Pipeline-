services:
  db:
    image: postgis/postgis:16-3.4
    container_name: etl_postgis
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -h db"]
      interval: 5s
      timeout: 5s
      retries: 20

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow_etl
    depends_on:
      db:
        condition: service_healthy
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: "SequentialExecutor"
      AIRFLOW__WEBSERVER__SECRET_KEY: "somethingsecret"
      AIRFLOW_HOME: /opt/airflow
      # Let webserver listen on all interfaces and on 8080
      AIRFLOW__WEBSERVER__WEB_SERVER_HOST: "0.0.0.0"
      AIRFLOW__WEBSERVER__WEB_SERVER_PORT: "8080"

      # pass Postgres env for your ETL tasks
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}

    ports:
      - "8080:8080"

    volumes:
      # Airflow DAGs
      - ./airflow/dags:/opt/airflow/dags
      # Startup script we just wrote
      - ./airflow/entrypoint.sh:/opt/airflow/entrypoint.sh
      # Your ETL code, so BashOperator can run it
      - ./etl:/app/etl
      - ./config:/app/config

    command: ["bash", "/opt/airflow/entrypoint.sh"]

